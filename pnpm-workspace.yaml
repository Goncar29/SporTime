catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
overrides:
  # The native Rollup binary crashes with SIGILL on CPUs without newer instruction sets.
  rollup: npm:@rollup/wasm-node@^4
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # tldts-core 7.4.20 is a partial release (remusao/tldts#2735); jsdom reaches it through tough-cookie.
  tldts: ^7.4.22
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Install scripts stay off unless a package needs one. These only auto-configure
# from an unused environment variable, print a version warning, or fetch a binary we do not use.
allowBuilds:
  "@firebase/util": false
  protobufjs: false
  esbuild: false
  re2: false
